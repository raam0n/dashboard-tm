<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/icons/logo-128.png" type="image/png">
  <title>AOE2 Group Dashboard - TM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Encabezado Principal -->
  <header class="main-header">
    <div class="brand">
      <img src="assets/icons/logo-128.png" alt="AOE2 Logo">
      <div>
        <h1>AOE2 Group Dashboard</h1>
      </div>
      <span class="badge-subtitle">TM Ranking</span>
    </div>

    <!-- Pestañas de Navegación -->
    <nav class="nav-tabs">
      <button class="nav-tab active" data-tab="rm_1v1">
        <span>⚔️</span> RM 1vs1
      </button>
      <button class="nav-tab" data-tab="rm_team">
        <span>🛡️</span> RM Team
      </button>
      <button class="nav-tab" data-tab="weekly">
        <span>📊</span> Winrate Semanal
      </button>
      <button class="nav-tab" data-tab="civs">
        <span>🗺️</span> Top Civs & Mapas
      </button>
    </nav>

    <!-- Acciones -->
    <div class="header-actions">
      <button class="btn" id="refreshBtn" title="Forzar actualización de datos">
        🔄 Refrescar
      </button>
      <button class="btn btn-primary" id="addPlayerBtn" title="Agregar un nuevo jugador por ID">
        ➕ Agregar Jugador
      </button>
    </div>
  </header>

  <!-- Banner Superior Live Now -->
  <section class="live-banner-container" id="liveBannerContainer">
    <!-- Renderizado dinámicamente -->
  </section>

  <!-- Contenedor Principal de Contenido (Grilla o Vistas) -->
  <main id="contentArea" class="cards-grid">
    <!-- Renderizado dinámicamente -->
  </main>

  <!-- Modal Detalle del Jugador -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-container" id="modalContainer">
      <!-- Rellenado por showPlayerModal -->
    </div>
  </div>

  <!-- Modal Agregar Jugador -->
  <div class="modal-overlay" id="addPlayerModal">
    <div class="modal-container" style="max-width: 480px;">
      <h3 style="color:#fff; font-size:1.4rem; margin-bottom:12px;">➕ Agregar Nuevo Jugador</h3>
      <p style="color:#aaa; font-size:0.9rem; margin-bottom:16px;">
        Ingresa el <strong>Profile ID</strong> de AoE2 (lo encuentras en la URL de su perfil en AoE2Companion o AoE2Insights).
      </p>
      <input 
        type="text" 
        id="addPlayerInput" 
        placeholder="Ej: 945834 o varios separados por coma" 
        style="width:100%; padding:10px 14px; background:#111; border:1px solid #444; border-radius:6px; color:#fff; font-size:1rem; margin-bottom:20px;"
      />
      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button class="btn" id="cancelAddBtn">Cancelar</button>
        <button class="btn btn-primary" id="confirmAddBtn">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Script Principal -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
